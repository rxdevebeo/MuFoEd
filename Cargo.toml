# Workspace root for the `strict-ooxml` toolkit.
#
# Stage 1 (`STAGE-1-TASK.md`) established `strict-ooxml-core` and the
# `strict-ooxml-cli` skeleton. Stage 2 (`STAGE-2-TASK.md`) adds
# `strict-ooxml-wml` (DOM + parser), the `strict-ooxml` meta-crate and the
# `xtool` inventory utility. Stage 3 (`STAGE-3-TASK.md`) adds
# `strict-ooxml-report` (Feature Report). Stage 4 (`STAGE-4-TASK.md`) adds
# `strict-ooxml-render-svg` and wires both into the meta-crate and the CLI.

[workspace]
resolver = "2"
members = [
    "strict-ooxml-core",
    "strict-ooxml-wml",
    "strict-ooxml-report",
    "strict-ooxml-fidelity",
    "strict-ooxml-render-svg",
    "strict-ooxml-render-pdf",
    "strict-ooxml-pdf",
    "strict-ooxml-convert",
    "strict-ooxml-ocr",
    "strict-ooxml-write",
    "strict-ooxml",
    "strict-ooxml-cli",
    "strict-ooxml-view",
    "xtool",
]

# NOTE: `codegen-units = 1` is deliberately *not* set here.
#
# It is needed for `cargo llvm-cov` to be reproducible (STAGE-5C-REWORK-1 C4):
# with the default 16 units the public entry points (`parse_document` and
# friends) are emitted once per unit, `llvm-cov` merges by source line, and a
# line covered in one copy and absent in another counts as uncovered — the
# number moved by 11 points on a 200-line change (79.80% -> 85.08% for
# `strict-ooxml-wml`). But paying for it in `[profile.dev]` slows every local
# debug build to fix a measurement only CI takes.
#
# The coverage job therefore sets `CARGO_PROFILE_DEV_CODEGEN_UNITS=1` for the
# measurement, and leaves everyone else on the default. See `.github/workflows/
# ci.yml`.
#
# The `[profile.dev]` override is removed, so a local `cargo llvm-cov` reports
# the *unreproducible* number; the CI value is the one that gates.

[workspace.package]
version = "0.1.0"
edition = "2021"
# One honest floor for the whole workspace, not two: the PDF page rasterizer
# (`hayro`, ADR-0011) needs 1.92, the CI gates build `--all-features`, and a
# manifest that promises 1.85 while a default-path dependency needs 1.92 is a
# promise cargo cannot keep. The CI has an MSRV job so this number is verified
# rather than declared.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/strict-ooxml"
authors = ["Strict OOXML contributors"]

[workspace.dependencies]
# Runtime dependencies (see STAGE-1-TASK.md §3).
miniz_oxide = "0.8"
memchr = "2"
encoding_rs = "0.8"
thiserror = "2"
quick-xml = "0.41"
rayon = "1"
# JSON serialization for the Feature Report (ADR-0005).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TrueType/OpenType metric extraction for the bundled metric-compatible fonts
# (STAGE-4-RENDER-FIDELITY S4F.1). `skrifa` is the maintained fontations
# parser (ttf-parser is unmaintained; RUSTSEC-2026-0192).
skrifa = "0.44"
# Development dependencies.
proptest = "1"
# SVG rasterization for the SSIM harness (S4F.5).
resvg = "0.48"
# Reference-PNG decoding for the SSIM harness.
png = "0.18"

# Lint policy (task S1.1). Every member crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints intentionally relaxed for this workspace.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
