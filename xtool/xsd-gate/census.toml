origin = "ours"
signal = "message"
elements = ["wrapTight", "wrapThrough"]
messages = ["Missing child element", "Expected is"]
summary = "wp:wrapTight / wp:wrapThrough written without the wp:wrapPolygon the schema requires"
audit = "not in the audit: this became reachable only when T6 (queue item 14) started resolving an mc:Choice Requires=\"wps\", which put a real wp:anchor with a tight wrap outside word/document.xml for the first time. The writer's own doc comment had said the polygon is 'written' - it was not, the child was omitted, and CT_WrapTight's xsd:sequence has no minOccurs on it. CLOSED 2026-10-02 in two steps, both measured: first an empty wp:wrapPolygon, which the census then rejected one level down (CT_WrapPath is `<start minOccurs=1/><lineTo minOccurs=2/>`, so there is no conformant no-polygon); then the frame's own rectangle - one wp:start and three wp:lineTo in EMU - which is a tight wrap around a box and is what the model can honestly say."

