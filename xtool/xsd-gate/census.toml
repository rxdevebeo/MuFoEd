audit = "COUNTED: parse every *.xml of the 58 Transitional documents; count @w:w on w:tblW/w:tcW/w:tblInd/w:wBefore/w:wAfter/w:tblCellSpacing, and @w:w on EVERY edge of w:tblBorders/w:tcBorders/w:tblCellMar/w:tcMar, keeping any value that is a bare number with no unit and no %. MEASURED 2026-10-02: 15 257 occurrences / 50 documents - tcW 2 544, tblCellMar left 2 243 + right 2 243 + top 2 178 + bottom 2 178, tblInd 1 859, tcMar 464 x 4, tblW 146, tblCellSpacing 7, wAfter 3. TWO corrections, in opposite directions. The audit's '~7 200 / 42' was low and named the wrong document count. Two intermediate corrections of this document also missed it, and by the same cause both times: counting ONE edge per container instead of all four, which loses 8 642 of the 15 257 on tblCellMar alone. `elements` also did not list w:tcW or w:tblW, the two largest single carriers at 2 690 between them, so the signal could never have matched them."

