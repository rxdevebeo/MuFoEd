[[item]]
id = "TZ-19"
origin = "ours"
signal = "picture"
elements = ["vml-picture-without-a-picture"]
summary = "a part that carried a VML picture and whose written form carries no picture at all"
audit = "queue item 10 (docs/transitional-to-strict-audit.md §11): v:shape#t75 + v:imagedata -> wp:inline / wp:anchor + pic:pic. The audit priced it at 2-3 days and called it the only item on the list that gives a document back something VISIBLE, and it was right about both. Closed 2026-10-02: the converter reuses v:imagedata/@r:id as a:blip/@r:embed unchanged, so no relationship surgery is needed, and it picks wp:anchor over wp:inline for a position:absolute shape - the corpus's pictures are watermarks, and an inline image would put a watermark in the text flow. Three things had to be built behind it, none of which the corpus's own failure mentioned: the DrawingML prefixes declared on a part that had only VML, the same prefixes declared on a WRITTEN header, and a `.rels` beside every header that holds a picture - the writer had never emitted one, because no header could hold a picture before this. Each was caught by the test suite rather than by the census, which is the honest note to leave here."

[[item]]
id = "TZ-20"
origin = "ours"
signal = "mce"
elements = ["mc:AlternateContent"]
summary = "an mc:AlternateContent block that survived T6 in a written package"
audit = "queue item 14, the last stage the audit §3 called 'not implemented at all': `McePolicy` was declared, documented and default-valued from the start and read nowhere, which made it a public API promising a behaviour that did not exist. CLOSED 2026-10-02: `normalize/mce.rs` resolves a block per the policy, taking the first mc:Choice whose every `Requires` prefix this project HANDLES - which is not the same as 'is in ECMA-376', because wps/wpg are reproduced from the model on purpose (ADR-0014) and six of the nine corpus blocks are a real shape behind a wps Requires. A block that resolves to nothing removes its content and is named, because three corpus settings.xml files carry `<mc:Choice Requires=`wpsCustomData`` with no fallback. The resolved branch goes back through T1-T5 and not straight into the writer, because six of the nine fallbacks are a w:pict and a bypass would have had its picture dropped rather than converted. `InvariantMode` is read in the same pass: it was the other half of the same defect, and it now enforces the two invariants the pipeline can decide alone - a namespace that is neither Strict nor removable, and an mc:Ignorable that survived T6 - while leaving the three that need the schemas to the XSD gate."

[[item]]
