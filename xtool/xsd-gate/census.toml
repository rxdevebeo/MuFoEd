summary = "closed by the fix: app.xml is carried, minus the seven counters that describe a rendering"
audit = "49 documents lost their extended properties (audit 8). CLOSED 2026-10-01: the part is carried with the Strict namespaces, and only Pages/Words/Characters/CharactersWithSpaces/Lines/Paragraphs/TotalTime are removed. The old reason - 'it is statistics about a rendering' - was right about those seven and wrong about Template, Company, DocSecurity, Application, AppVersion, HeadingPairs and TitlesOfParts, and it cost 49 documents their metadata to avoid asserting five numbers."

