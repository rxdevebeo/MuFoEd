# Census registry: `TZ-nn`, the Transitional -> Strict queue.
#
# `docs/transitional-to-strict-audit.md` is the measurement these items come from,
# and `xtool/xsd-gate/census_gate.py` is the instrument that reproduces it. An item
# closes on a **measured zero** and never on a code review - the same rule the
# `XS-nn` registry in `registry.toml` follows, and for the same reason: the audit
# reviewed the writer and found none of the `XS-nn`, because nine of its eleven
# fixtures had been written by this project.
#
# `origin` decides what a non-zero count means, and it is the field that makes a
# number mean anything:
#
#   `ours`    a violation we produce. The gate fails.
#   `source`  markup the producer shipped, in a part we carry verbatim. It is
#             counted, printed and named - never called green and never counted
#             green by silence.
#
# `signal` says which measurement the item is closed on. Four exist, because a
# schema message is the only one of them that shows up for every defect class:
#
#   `message`     a libxml2 schema violation in our output. `elements` is the
#                 offending element's LOCAL name and `messages` are substrings of
#                 libxml2's message - the element alone cannot separate a `w:ind`
#                 inside a cell margin from one inside a paragraph.
#   `extension`   a node in the `extension` basket: a namespace the ECMA set does
#                 not declare, which MCE processing removes and which therefore
#                 produces no schema message at all. `elements` are markers
#                 matched against the node's qualified name.
#   `dropped`     a part the input package carried and our output does not. This
#                 is the only signal that can see a *silent* loss: a part that is
#                 absent validates perfectly. `elements[0]` is the normalized part
#                 shape (`word/media/image#.png`).
#   `lossy`       a `Lossy` record in the normalizer's own report.
#
# Measured on 2026-10-01 against ECMA-376-1 5th edition, 58 Transitional
# documents, with `write --transitional` and the same patched oracle
# `xsd_gate.py` uses. The audit's counts are kept in `audit`, so a regression is
# visible next to the number it replaced.

[[item]]
id = "TZ-01"
origin = "ours"
signal = "message"
elements = ["tblW", "tcW", "wAfter", "wBefore", "tblCellSpacing"]
messages = ["is not a valid value of the union type"]
summary = "ST_MeasurementOrPercent written as bare fiftieths-of-a-percent: w:w=\"5000\""
audit = "84 messages / 2 documents (audit 9). Also closes the assumption Q-E5: `pct` is fiftieths, so 5000 = 100%."

