audit = "COUNTED: parse every *.xml of the 58 Transitional documents; inside w:tblBorders/w:tcBorders/w:tblCellMar/w:tcMar count w:left and w:right. MEASURED 2026-10-02: 23 080 edge elements / 42 documents - tcBorders 7 500 + 7 502 / 21, tblCellMar 2 243 + 2 243 / 47, tblBorders 1 332 + 1 332 / 22, tcMar 464 + 464 / 5. The audit's 11 462 was half of the truth, for the same reason TZ-12's was short of it: one edge per container instead of the pair, summed over a cascade. Its 42 documents is correct and is the one number here that survived. XS-23 is the same trap seen from the writer's side. READ THIS BEFORE TRUSTING THE ZERO: on this corpus every one of those edges is in a part the writer REGENERATES, and the writer already emits start/end, so the normalizer never sees one and this signal cannot distinguish a working rule from a dead one. It reported 0 for a rule that was dead for the whole of 2026-10-02 - `is_wml` matches only the Strict namespace, and the element path was testing the Transitional one. The gate for this item is `strict-ooxml-core/src/normalize/transitional.rs::the_direction_neutral_rename_follows_the_container_and_not_the_name`, which is a unit test ON PURPOSE: a corpus gate cannot see a rule the corpus never exercises."

