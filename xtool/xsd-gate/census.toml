# Census registry: `TZ-nn`, the Transitional -> Strict queue.
#
# `docs/transitional-to-strict-audit.md` is the measurement these items come from,
# and `xtool/xsd-gate/census_gate.py` is the instrument that reproduces it. An item
# closes on a **measured zero** and never on a code review - the same rule the
# `XS-nn` registry in `registry.toml` follows, and for the same reason: the audit
# reviewed the writer and found none of the `XS-nn`, because nine of its eleven
# fixtures had been written by this project.
#
# `origin` decides what a non-zero count means, and it is the field that makes a
# number mean anything:
#
#   `ours`    a violation we produce. The gate fails.
#   `source`  markup the producer shipped, in a part we carry verbatim. It is
#             counted, printed and named - never called green and never counted
#             green by silence.
#
# `signal` says which measurement the item is closed on. Four exist, because a
# schema message is the only one of them that shows up for every defect class:
#
#   `message`     a libxml2 schema violation in our output. `elements` is the
#                 offending element's LOCAL name and `messages` are substrings of
#                 libxml2's message - the element alone cannot separate a `w:ind`
#                 inside a cell margin from one inside a paragraph.
#   `extension`   a node in the `extension` basket: a namespace the ECMA set does
#                 not declare, which MCE processing removes and which therefore
#                 produces no schema message at all. `elements` are markers
#                 matched against the node's qualified name.
#   `dropped`     a part the input package carried and our output does not. This
#                 is the only signal that can see a *silent* loss: a part that is
#                 absent validates perfectly. `elements[0]` is the normalized part
#                 shape (`word/media/image#.png`).
#   `lossy`       a `Lossy` record in the normalizer's own report.
#   `element`     a Strict-declared element present in an input part and absent
#                 from the same part in the written package (inventory). Matching
#                 uses a qualified label (`w:left`) plus optional `parents` /
#                 `parts` filters. This is NOT a schema message: disposition is
#                 `named_loss`, `declared_transform`, or an owned `ours` loss.
#
# `disposition` (optional, for `signal = "element"`) records why a non-zero count
# is acceptable or owned:
#
#   `named_loss`            removal the project documents (report or registry).
#   `declared_transform`    rename / regeneration / service recalculation.
#   `unnamed_loss`          real silent loss; use with `origin = "ours"`.
#
# `blind_to` says what the item's signal CANNOT see, which is a different question
# from what it can and a more important one: a zero from a blind signal is the
# absence of evidence, and printing it as `closed` beside no reason is how `TZ-04`
# reported 0 for a rule that had been dead all day. Two values, both measured:
#
#   `writer output`      the normalizer has NO rule for this item at all - the
#                        writer emits the Strict form. Measured on our own
#                        written corpus: 3 660 of 3 660 `ST_MeasurementOrPercent`
#                        measures already carry a unit or a `%`, 489 of 489
#                        `ST_TextScale` carry `%`, 40 of 40 `w:zoom` carry
#                        `@w:percent`, 62 of 62 `w:pgMar` carry all three of
#                        `gutter`/`header`/`footer`. And the stage counters over
#                        the 58 documents show no firing that would correspond to
#                        any of these items - which is the same finding as reaudit
#                        П-1: the item is closed IN THE WRITER. A regression is
#                        possible in the writer, and this corpus cannot see one.
#   `regenerated parts`   the rule DOES fire, on real bytes: T3.rename 5 418,
#                        T4.value 2 283, T4.tblLook 136, T6.mce 341, T7.vml-shape
#                        14 across the corpus. But every occurrence is in a part
#                        the writer rebuilds from the model, so the violation
#                        cannot appear in the written package either way and the
#                        count would not move if the rule were deleted. The gate
#                        for these is the unit test named in `audit`.
#
# `TZ-19`, `TZ-20` and `TZ-21` carry no `blind_to`: the corpus exercises them
# (`T7.vml-shape` 14, `T6.mce` 341), so their zeros are measurements.
#
# Measured on 2026-10-01 against ECMA-376-1 5th edition, 58 Transitional
# documents, with `write --transitional` and the same patched oracle
# `xsd_gate.py` uses. The audit's counts are kept in `audit`, so a regression is
# visible next to the number it replaced.

