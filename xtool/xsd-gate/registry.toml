# The XSD gate's registry of known divergences.
#
# `STAGE-10G-TASK.md` G17: an item closes when its MEASURED count is zero. Reading
# the diff never closes one, and neither does a code review - the audit that
# produced this file reviewed the writer for a stage and found none of these,
# because nine of its eleven fixtures were written by this project and our wrong
# element order happened to be our own fixtures' wrong element order.
#
# Matching, for every item, is BOTH of:
#   - the offending ELEMENT's local name is in `elements`;
#   - at least one substring in `messages` appears in libxml2's message.
# Both are needed. The element alone cannot tell `<w:ind>` inside a cell margin
# from `<w:ind>` inside a paragraph, and the message alone cannot tell one
# element's violation from another's.
#
# `origin` decides what a non-zero count MEANS, and it is the one field that can
# change what the gate's exit code says:
#
#   ours   our writer produced it. The gate fails while it is non-zero. Closing it
#          means changing the writer, or proving the count is zero.
#
#   source the document's producer shipped it and we carry it verbatim. Diagram
#          parts go through pass-through and are not modelled, so "fixing" them
#          would mean rewriting bytes we promised to preserve. The gate prints
#          these, counts them, and does not fail on them - which is G18: `XS-16`
#          is closed by MARKING THE SOURCE, not by repairing a file that is
#          someone else's. A count here is a debt we are carrying on purpose.

# --------------------------------------------------------------------------
# Queue 1-3: the writer, unconditionally
# --------------------------------------------------------------------------

[[item]]
id = "XS-01"
origin = "ours"
elements = ["family", "pitch"]
messages = ["is required but missing"]
summary = "w:fontTable: w:family and w:pitch written without their required w:val"

