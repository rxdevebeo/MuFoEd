[package]
name = "strict-ooxml-render-svg"
description = "Deterministic SVG rendering (layout) for WordprocessingML Strict documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "wordprocessingml", "svg", "rendering"]
categories = ["parser-implementations", "rendering"]

[features]
default = []
# Optional system-font provider (outside the Stage-4 acceptance criteria).
system-fonts = []

[dependencies]
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
# Reads the bundled metric-compatible fonts' advances (S4F.1).
skrifa.workspace = true
# OpenType shaping shared by layout measurement and paint cluster positions (F07).
rustybuzz.workspace = true
# Hash of the exact face bytes delivered to SVG `@font-face` and PDF embedding.
sha2.workspace = true

[dev-dependencies]
# Independent XML/SVG parser used only as an oracle by the tests (ADR-0006).
roxmltree = "0.20"
# AUD-71: property test that `fmt_num` never emits NaN/inf.
proptest.workspace = true
criterion = "0.5"
# Rasterize our SVG for the SSIM harness (S4F.5).
resvg.workspace = true
# Re-encode a page as a PNG for `examples/page_diff.rs`. The gate's own decoder
# lives in `strict-ooxml-fidelity`; this is the writer of the pictures the tool
# leaves on disk.
png.workspace = true
# Read the fidelity-gate policy from `coverage/render-gates.toml` and run the
# gate's arithmetic (GATE-STRATEGY §5/§6). The PDF gate measures the same
# references through a second renderer, so the measurement is one crate's.
strict-ooxml-fidelity = { version = "0.1.0", path = "../strict-ooxml-fidelity" }
# `tests/waivers.rs` reads `docs/waivers.toml` the same way the gate's own policy
# file is read: a threshold or a waiver is data, not a constant in a test.
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "render"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
