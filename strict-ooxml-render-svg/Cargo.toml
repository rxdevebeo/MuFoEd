[package]
name = "strict-ooxml-render-svg"
description = "Deterministic SVG rendering (layout) for WordprocessingML Strict documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "wordprocessingml", "svg", "rendering"]
categories = ["parser-implementations", "rendering"]

[features]
default = []
# Optional system-font provider (outside the Stage-4 acceptance criteria).
system-fonts = []

[dependencies]
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
# Reads the bundled metric-compatible fonts' advances (S4F.1).
skrifa.workspace = true

[dev-dependencies]
# Independent XML/SVG parser used only as an oracle by the tests (ADR-0006).
roxmltree = "0.20"
criterion = "0.5"
# Rasterize our SVG for the SSIM harness (S4F.5).
resvg.workspace = true
# Decode the WPS reference PNGs for the SSIM harness.
png.workspace = true
# Read the fidelity-gate policy from `coverage/render-gates.toml` (GATE-STRATEGY
# §5/§6): thresholds are data with their justification beside them, not
# constants buried in a test.
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "render"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
