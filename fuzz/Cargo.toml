[package]
name = "strict-ooxml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
strict-ooxml-core = { path = "../strict-ooxml-core" }
strict-ooxml-wml = { path = "../strict-ooxml-wml" }
strict-ooxml-pdf = { path = "../strict-ooxml-pdf" }
strict-ooxml-convert = { path = "../strict-ooxml-convert" }
strict-ooxml = { path = "../strict-ooxml", features = ["report", "svg", "write"] }

[[bin]]
name = "fuzz_zip"
path = "fuzz_targets/fuzz_zip.rs"
test = false
doc = false

[[bin]]
name = "fuzz_xml"
path = "fuzz_targets/fuzz_xml.rs"
test = false
doc = false

[[bin]]
name = "fuzz_relpath"
path = "fuzz_targets/fuzz_relpath.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wml"
path = "fuzz_targets/fuzz_wml.rs"
test = false
doc = false

[[bin]]
name = "fuzz_normalize"
path = "fuzz_targets/fuzz_normalize.rs"
test = false
doc = false

[[bin]]
name = "fuzz_docx_full"
path = "fuzz_targets/fuzz_docx_full.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pdf"
path = "fuzz_targets/fuzz_pdf.rs"
test = false
doc = false

[[bin]]
name = "fuzz_convert"
path = "fuzz_targets/fuzz_convert.rs"
test = false
doc = false

[workspace]
