# Stage-5 (5A + 5B) extended-scenario coverage inventory (ZAKAZ-STAGE-5/5B §3.1.7, §11.1).
#
# Curated map of the extended scenarios the renderer claims to cover. It is an
# independent, human-authored matrix (not derived from the parser's
# problem-only SupportModel) and is checked by
# `strict-ooxml-wml/tests/stage5_coverage.rs` and `xtool coverage`.
#
# status: supported | partial | unsupported | ignored
#   supported   - fully implemented and tested
#   partial     - implemented with a documented limitation
#   unsupported - recognised but not implemented (counts against coverage)
#   ignored     - deliberately out of the 5A/5B scope (excluded from the ratio)
# Coverage = (supported + partial) / (supported + partial + unsupported) >= 85%.

[meta]
