[[elements]]
name = "math.mathml_export"
status = "supported"
note = "model -> MathML projection for the independent structural oracle (S5C decision 9.6)"
[[elements]]
name = "math.detachment"
status = "supported"
note = "every stretchy construct is an independent node, not a stretchy glyph run"
[[elements]]
name = "math.wrap"
status = "supported"
note = "a long inline formula moves to the next line as an atomic unit"
[[elements]]
name = "math.line_growth"
status = "partial"
note = "a formula line keeps the paragraph's natural height and grows by the formula's own box, capped at 1.60x; both WPS references measure exactly that. The cap still clips the box of a construct taller than 1.6 lines (a large m:m), so its ink can overlap the next line"
[[elements]]
name = "math.display_spacing"
status = "supported"
note = "a display formula is a self-contained block: the paragraph's own w:spacing is not added around it, and the line it interrupts is emitted only when it carries content (STAGE-5C-REWORK-1 C1)"
[[elements]]
name = "math.grid_metrics"
status = "partial"
note = "m:m/m:eqArr rows sit on the nominal line grid of the math face (Cambria Math hhea, 1.164 em) and m:rSp/m:cSp are read as twips or hundredths of an em per m:rSpRule/m:cGpRule; the residual drift of three stacked display blocks on a synthetic all-constructs page is ~11 px (STAGE-5C-REWORK-1 C1)"
[[elements]]
name = "math.large_operators"
status = "partial"
note = "a large operator grows to a tabulated display cut (height and aspect measured from the WPS references) only in m:oMathPara, as Word does; the bundled face has no display cut, so the glyph is stroked as a vector path and carries less ink than WPS's filled glyph"
[[elements]]
name = "math.arg_alignment"
status = "partial"
note = "m:aln is honoured for m:m columns (m:mcJc) and m:eqArr rows (m:baseJc); for other arguments the construct's own centring wins"
[[elements]]
name = "math.phantom_transparency"
status = "partial"
note = "m:show is honoured; m:transp/m:showAll only affect the reserved space, not the alpha of drawn ink"
[[elements]]
name = "math.control_revision"
status = "partial"
note = "m:ctrlPr/w:rPr colours the construct; a w:ins/w:del revision marker inside m:ctrlPr is recorded and dropped"
[[elements]]
name = "math.brk"
status = "partial"
note = "m:brk is parsed and reported; the renderer applies its own line breaking"
[[elements]]
name = "math.shp_delimiter"
status = "partial"
note = "m:dPr/m:shp is parsed and reported; the delimiter is drawn in its glyph form"
[[elements]]
name = "math.ole_fields"
status = "unsupported"
note = "MathType/OLE field formulas (no OMML) are out of scope (S5C 3.2)"
