# Visual-fidelity gate policy (GATE-STRATEGY §5, §6; STAGE-4-RENDER-FIDELITY
# S4F.5). This file is the single place a fidelity threshold or a structural
# tolerance is written down, and `strict-ooxml-render-svg/tests/ssim.rs` reads
# it rather than carrying its own copies.
#
# Why a data file: a threshold edited inside a test looks like a test change
# and gets reviewed as one. Here it is a value in a table, next to the reason
# it has that value and next to the documents it applies to, so loosening a
# bound is a reviewable diff in the file that also says what loosening it
# costs.
#
# status vocabulary is not used here (unlike coverage/*.toml): these are
# limits, not claims about element support.

[meta]
standard = "ISO/IEC 29500-1:2008 Strict"
revision = "2026-09-29"
source = "GATE-STRATEGY.md §5"

# The fidelity criterion, and the margin a document must clear over it to
# pass outright (GATE-STRATEGY §3.2). The margin exists because several
# documents clear the criterion by three thousandths while the gate runs on
# three operating systems; at that distance the score cannot distinguish a
# property of the layout from a property of one rasterizer build.
[thresholds]
ssim = 0.95
ssim_margin = 0.01

# Documents allowed to sit inside the margin band, i.e. to clear `ssim`
# without clearing `ssim_margin`.
#
# A document *not* listed here that lands in the band fails the gate, so a new
# fixture cannot join the gate just below the line without being written down
# on purpose. The gate also compares this list against the set it observes, so
# an entry left behind after the fix is a failure too and the list cannot
# quietly become a graveyard.
#
# Each entry is outstanding debt with a named defect, and each has a waiver in
# `docs/waivers.toml`. Removing an entry is progress; adding one is a decision
# that has to be made on purpose.
amber = ["strict-stage5c"]

# ---------------------------------------------------------------------------
# Classes. `documents` is the class membership: it replaces the match
# statement that used to decide which fixture got which limits, so a new
# fixture has to declare its class rather than fall into a default.
# ---------------------------------------------------------------------------

[[classes]]
name = "text"
rationale = """
Real Strict text. Carlito/Arimo/Tinos/Cousine stand in for the nominal
faces with matching advances, so the ink lands where Word puts it. The
default bounds are met by every page in this class at 0-1 px.
"""
documents = ["strict-text", "strict-text-grid"]
max_shift_px = 2
max_centroid_px = 2.5
min_row_correlation = 0.90
min_column_correlation = 0.85
max_extent_px = 2.0

[[classes]]
name = "mixed"
rationale = """
Tables, notes, fields and numbering on one page. The profile correlations
are relaxed because a sparse mixed page carries little structure for them;
the rasterizer-independent checks (ink coverage, shift, centroid, extent)
stay at the default. Measured extent drift: 0-1 px.
"""
documents = ["strict-stage5"]
max_shift_px = 2
max_centroid_px = 3.0
min_row_correlation = 0.75
min_column_correlation = 0.70
max_extent_px = 2.0

[[classes]]
name = "graphics"
rationale = """
Floating drawing objects, groups, text boxes and page borders. Large solid
fills make the row/column ink profiles correlate only weakly with the WPS
raster, and the rasterizer's fill/edge antialiasing moves the ink centroid
while the profile alignment stays exact (dx = dy = 0). Ink coverage, the
blank check and the shift bound are unchanged. Measured extent drift: 1 px.
"""
documents = ["strict-stage5b"]
max_shift_px = 2
max_centroid_px = 8.0
min_row_correlation = 0.60
min_column_correlation = 0.50
max_extent_px = 2.0

[[classes]]
name = "formulas"
rationale = """
OMML formulas and inline shapes. The pages are sparse, so the profile
correlations carry little structure to correlate and are not a meaningful
measure here.

**The three position bounds below are sanity bounds, not fidelity claims,
and that is a change (2026-10-01).** They compare our ink's position
against a reference drawn in **Cambria Math**, and this renderer draws
**STIX Two Math**: no OFL face is metric-compatible with Cambria Math
(`strict-ooxml-render-svg/assets/fonts/ATTRIBUTION.md`), and the reference
gives it away in the construct it synthesizes. On
`06-strict-math-display` the quadratic formula is **120 px wide in the
reference and 97 px in ours**, because the radical's vinculum is a
synthesized path whose width follows our radicand while Cambria Math's is
a glyph; 23 px of missing width moves the ink's centre of mass about
11 px to the left, which is the −12.16 px this bound is set from. No
amount of layout arithmetic closes a gap whose size is a glyph.

So the numbers are the **measured** substitution effect, rounded up, and
what they still catch is stated rather than assumed: a content band that
has moved by a third of the page, which is what a lost formula, a
duplicated one or a block in the wrong place looks like. They do **not**
catch a drift of a few pixels, and nothing in this file claims they do.

The fine-grained protection is elsewhere and it is exact:

- `EXTENT_RATCHET` (`tests/ssim.rs`) pins every gated page's ink extent
  individually, so a regression of one pixel on one page fails even
  though the class bound is 34;
- `tests/math.rs` and the unit tests in `src/math/layout.rs` hold the
  layout's own invariants — a fraction's rule never touches its parts,
  whichever face is in use;
- **SSIM is 0.95 for this class like every other, and every page in it
  clears it** (0.9513…0.9805). That is the fidelity claim. It was not
  reachable while the layout was wrong: the same pages measured
  0.9349…0.9496 before the fraction and paragraph-spacing fixes, so
  `docs/stage-5c-report.md` §5.1's "no OFL face will buy the threshold"
  was measuring the layout and blaming the font.

max_extent_px = 34 is the coarse gate (the largest measured is 30 px on
`strict-stage5c` page 2); max_shift_px = 22 and max_centroid_px = 25 are
the same kind of number. min_row/column_correlation stay at the measured
0.45 / 0.40: those do measure structure, and a formula page's
correlation is low because the page is sparse, not because the layout
drifted.
"""
documents = [
  "strict-stage5c",
  "05-strict-math-simple",
  "06-strict-math-display",
  "07-strict-drawingml-shapes",
  "10-strict-math-eqarr",
]
max_shift_px = 12
max_centroid_px = 25.0
min_row_correlation = 0.45
min_column_correlation = 0.40
max_extent_px = 18.0

# One document, bounds its class cannot carry.
#
# `strict-stage5c` is the hardest page in the gate: two display formulas, both of
# them a matrix and a radical, and the substitution is at its largest there — the
# ink's centroid is 29 px from the reference and its best whole-page alignment is
# 22 px. Writing those numbers into the class would loosen the shift bound for
# `05-strict-math-simple` and `10-strict-math-eqarr` as well, and
# `structural_check_rejects_blank_and_shifted_stage5c_pages` is what says so: it
# asserts that a 20 px vertical drift is still rejected, and it failed the moment
# the class was widened to fit this one document.
#
# So the class keeps bounds a drifted page still trips, and this document carries
# its own with the numbers measured on it. The fine-grained protection is still
# per page: `EXTENT_RATCHET` pins every page's ink extent exactly.
[[overrides]]
document = "strict-stage5c"
max_shift_px = 26
max_centroid_px = 32.0
max_extent_px = 34.0

# ---------------------------------------------------------------------------
# Page-count-only documents.
#
# Their content is raster this renderer does not produce (DrawingML charts),
# so a per-pixel comparison would measure the reserved placeholder. The
# page-count invariant is what is meaningful and is enforced.
# ---------------------------------------------------------------------------
[[page_count_only]]
name = "strict-profile"
rationale = "DrawingML chart and diagram, out of scope since Stage 4."

[[page_count_only]]
name = "09-strict-math-drawing-chart"
rationale = "Real Strict package with a DrawingML chart part; Stage 6 scope."
