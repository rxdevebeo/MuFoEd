[package]
name = "strict-ooxml-edit"
description = "Transactional text editing over the existing WordprocessingML model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = ["save", "visual"]
save = ["dep:strict-ooxml-write"]
visual = ["dep:strict-ooxml-render-svg", "dep:unicode-segmentation"]

[dependencies]
strict-ooxml-wml = { path = "../strict-ooxml-wml", version = "0.1.0" }
strict-ooxml-core = { path = "../strict-ooxml-core", version = "0.1.0" }
strict-ooxml-write = { path = "../strict-ooxml-write", version = "0.1.0", optional = true }
strict-ooxml-render-svg = { path = "../strict-ooxml-render-svg", version = "0.1.0", optional = true }
unicode-segmentation = { version = "1.12", optional = true }

[dev-dependencies]
png.workspace = true
proptest.workspace = true
strict-ooxml-testkit = { path = "../strict-ooxml-testkit" }
strict-ooxml-write = { path = "../strict-ooxml-write", version = "0.1.0" }

[lints]
workspace = true

[[test]]
name = "save"
required-features = ["save"]

[[test]]
name = "visual"
required-features = ["visual"]
