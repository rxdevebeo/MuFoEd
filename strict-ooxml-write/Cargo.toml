[package]
name = "strict-ooxml-write"
description = "Serialization of a WordprocessingML Strict document model back to a .docx package (STAGE-8-TASK.md phase 8A)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "wordprocessingml", "writer", "serialization"]
categories = ["parser-implementations", "encoding"]

[dependencies]
sha2 = { workspace = true }
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }

[dev-dependencies]
# Independent XML parser used only as an oracle by the tests (SC-3).
roxmltree = "0.20"
strict-ooxml-testkit = { path = "../strict-ooxml-testkit" }
# The layout engine, for the one assertion the writer's own crates cannot make:
# that a written document still occupies as many pages as the original (W7's exit
# criterion). It is a leaf crate — it depends on `core` and `wml` only — so this
# is a dev-dependency and not a cycle.
strict-ooxml-render-svg = { version = "0.1.0", path = "../strict-ooxml-render-svg" }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
