[package]
name = "strict-ooxml-convert"
description = "PDF to WordprocessingML Strict conversion in semantic and visual modes (STAGE-8-TASK.md phase 8C+)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["pdf", "ooxml", "docx", "convert", "text-extraction"]
categories = ["text-processing", "parser-implementations"]

[features]
default = []
# Reading the text of a page that has none, by rasterizing it and asking a
# `TextRecovery` (`STAGE-8-TASK.md` §6, O11). Off by default: a page image has
# to come from somewhere, and that somewhere is a 75-crate software rasterizer.
# Without it a page this reader cannot read is reported as a loss instead, which
# is the honest answer and the reason the loss report has that entry.
raster = ["strict-ooxml-pdf/raster"]
# The transport to a real model, for `examples/live_recovery.rs` only. The crate's own
# code asks a `TextRecovery` trait and never names a transport, so this feature
# exists for the probe: a build without it cannot talk to a daemon, and that is
# the point of a trait.
ocr-ollama = ["strict-ooxml-ocr/ocr-ollama"]

[dependencies]
# Reading the PDF: pages, glyphs, images, paths.
strict-ooxml-pdf = { version = "0.1.0", path = "../strict-ooxml-pdf" }
# The model that comes out.
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
# Part ids and the media content types the writer needs.
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
# Optional recognition of graphic regions (stage 8D). The crate itself has
# no transport, so this costs nothing until a caller supplies a model.
strict-ooxml-ocr = { version = "0.1.0", path = "../strict-ooxml-ocr" }

[dev-dependencies]
# The whole chain, so the conversion is tested as a package a reader can open
# rather than as a DOM in memory.
strict-ooxml-write = { version = "0.1.0", path = "../strict-ooxml-write" }
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-render-pdf = { version = "0.1.0", path = "../strict-ooxml-render-pdf" }
strict-ooxml-render-svg = { version = "0.1.0", path = "../strict-ooxml-render-svg" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
# The independent XML oracle for what the writer produced.
roxmltree = "0.20"
# The recognition tests build a PNG by hand.
png = "0.18"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
