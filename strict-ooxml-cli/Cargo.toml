[package]
name = "strict-ooxml-cli"
description = "Command-line interface for inspecting and checking WordprocessingML Strict packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "strict-ooxml"
path = "src/main.rs"
# The binary shares its normalized name with the `strict-ooxml` meta-crate lib;
# skip its rustdoc target to avoid a filename collision.
doc = false

[features]
# `fonts install` and `--fetch-fonts` download font packs over HTTPS; without
# the feature the CLI stays offline and uses only packs already in the cache.
default = ["font-download"]
font-download = ["strict-ooxml/font-download"]
# `from-djvu --ocr` and `from-pdf --ocr`: a local Ollama vision model reads
# scanned pages; PDF pages are rasterized for it first.
ocr-ollama = ["strict-ooxml/ocr-ollama", "strict-ooxml/pdf-raster"]

[dependencies]
sha2 = "0.11"
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
# AUD-90: meta-crate default is only report+svg; CLI opts into write/pdf/convert.
strict-ooxml = { version = "0.1.0", path = "../strict-ooxml", features = ["report", "svg", "write", "pdf", "convert", "rtf", "djvu-image", "system-fonts", "font-packs"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
strict-ooxml-testkit = { path = "../strict-ooxml-testkit" }
strict-ooxml-djvu = { path = "../strict-ooxml-djvu" }
djvu-bzz = "=0.40.2"

[lints]
workspace = true
