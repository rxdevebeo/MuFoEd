[package]
name = "strict-ooxml-cli"
description = "Command-line interface for inspecting and checking WordprocessingML Strict packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "strict-ooxml"
path = "src/main.rs"
# The binary shares its normalized name with the `strict-ooxml` meta-crate lib;
# skip its rustdoc target to avoid a filename collision.
doc = false

[dependencies]
sha2 = "0.11"
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
# AUD-90: meta-crate default is only report+svg; CLI opts into write/pdf/convert.
strict-ooxml = { version = "0.1.0", path = "../strict-ooxml", features = ["report", "svg", "write", "pdf", "convert"] }

[dev-dependencies]
strict-ooxml-testkit = { path = "../strict-ooxml-testkit" }

[lints]
workspace = true
