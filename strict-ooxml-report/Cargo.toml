[package]
name = "strict-ooxml-report"
description = "Feature Report (support analysis) for WordprocessingML Strict documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "wordprocessingml", "report", "strict"]
categories = ["parser-implementations"]

[dependencies]
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Independent JSON-Schema validator, used only by the tests (ADR-0005).
# `default-features = false` drops the HTTP/file resolvers: the schema is
# self-contained, so no resolver is needed.
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
