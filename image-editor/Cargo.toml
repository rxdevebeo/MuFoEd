[package]
name = "image-editor"
description = "Layered raster editing and Plakat-backed image generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
demo = ["dep:eframe", "dep:rfd"]
plakat = ["dep:plakat", "dep:tokio", "dep:candle-core"]
plakat-cuda = ["plakat", "plakat/cuda"]

[dependencies]
mufoed-model-runtime = { path = "../model-runtime" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
imageproc = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
egui = "0.35"
eframe = { version = "0.35", optional = true }
rfd = { version = "0.17", optional = true }
plakat = { git = "https://github.com/vulogov/plakat", rev = "ce0d67a45bc9b5f742c3772aef85afe0d15890f6", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
getrandom = "0.4"
candle-core = { version = "0.10.2", optional = true }

[[bin]]
name = "image-editor-demo"
path = "src/main.rs"
required-features = ["demo"]

[[example]]
name = "native_smoke"
required-features = ["plakat"]

[lints]
workspace = true
