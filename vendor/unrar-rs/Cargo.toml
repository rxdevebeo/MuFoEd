# Vendored from the owner's unrar-rs (D:\projects\UnRAR\unrar-rs): a pure
# Rust port of UnRAR. MuFoEd patch: the manifest names the UnRAR licence as a
# LicenseRef (for cargo-deny), drops the example and dev-dependencies, and
# declares its own workspace; the sources are rustfmt-formatted with LF ends.
[package]
name = "unrar-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Pure Rust port of the UnRAR archive extraction library"
license = "LicenseRef-UnRAR"
readme = "README.md"
keywords = ["rar", "unrar", "archive", "extract"]
categories = ["compression"]
publish = false

# Its own workspace: never part of the one around it.
[workspace]

[dependencies]
aes = "0.8"
cbc = "0.1"
crc32fast = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
