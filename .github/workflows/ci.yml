name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The gates above build `--all-features`, so a crate that only compiles with
      # every feature on is invisible to all of them - and `strict-ooxml-convert`
      # sat that way for a whole increment: `Recovered` carried a type that was
      # behind `feature = "raster"`, and the default build did not compile. One
      # check, no features, is what makes the default build a promise again.
      - name: Check (default features)
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-features
      - name: WML independent oracle (P-1)
        run: cargo test -p strict-ooxml-wml --all-features --test corpus_oracle
      - name: Feature Report schema validation (independent oracle)
        run: cargo test -p strict-ooxml-report --all-features --test schema
      - name: Feature Report determinism
        run: cargo test -p strict-ooxml-report --all-features --test determinism
      - name: CLI exit codes and report command
        run: cargo test -p strict-ooxml-cli --test cli
      - name: SVG validity oracle (independent parser)
        run: cargo test -p strict-ooxml-render-svg --all-features --test svg_oracle
      - name: Renderer determinism and images
        run: |
          cargo test -p strict-ooxml-render-svg --all-features --test render
          cargo test -p strict-ooxml-render-svg --all-features --test images
      - name: Renderer corpus (no panics)
        run: cargo test -p strict-ooxml-render-svg --all-features --test corpus
      - name: Render fidelity (SSIM >= 0.95 vs pinned WPS references)
        run: cargo test -p strict-ooxml-render-svg --all-features --test ssim
      # The PDF half of the same gate (SC-6, `CORE-QUEUE.md` §1 `O-2`): the same
      # WPS references, compared against our own PDF rasterized by `hayro` and
      # read back through our own reader. `--features raster` is named because the
      # feature is what turns the comparison on, and a gate that silently skipped
      # itself would be worse than no gate. The first run of it found two defects
      # in the PDF backend that no other test in the workspace could see.
      - name: PDF render fidelity (SSIM >= 0.95 vs pinned WPS references)
        run: cargo test -p strict-ooxml-pdf --features raster --test pdf_pixels
      - name: Real Strict corpus (REWORK-WML-1 + fidelity)
        run: cargo test -p strict-ooxml --all-features --test strict_corpus
      - name: Stage-5 fixture (independent XML oracle + corpus)
        run: |
          cargo test -p strict-ooxml-wml --all-features --test stage5_fixture_oracle
          cargo test -p strict-ooxml-wml --all-features --test stage5_coverage
          cargo test -p strict-ooxml --all-features --test stage5_corpus
      - name: Stage-5B floating DrawingML (oracle + corpus + real Strict)
        run: |
          cargo test -p strict-ooxml-wml --all-features --test drawing_stage5b
          cargo test -p strict-ooxml-wml --all-features --test stage5b_fixture_oracle
          cargo test -p strict-ooxml-render-svg --all-features --test floating
          cargo test -p strict-ooxml-render-svg --all-features --test strict_profile
          cargo test -p strict-ooxml --all-features --test stage5b_corpus
      - name: Stage-5C OMML formulas (oracle + corpus + real Strict repros)
        run: |
          cargo test -p strict-ooxml-wml --all-features --test stage5c_fixture_oracle
          cargo test -p strict-ooxml-wml --all-features --test coverage_gate
          cargo test -p strict-ooxml-render-svg --all-features --test math
          cargo test -p strict-ooxml --all-features --test stage5c_corpus
      - name: Docs
        run: cargo doc --workspace --no-deps
      # G-6 is cheap, needs no dependency and no network, and it belongs next to
      # the other gates so a vendored schema cannot slip in unnoticed. The gate
      # itself runs once, on one OS, in the `xsd-gate` job below: it downloads
      # 43 MB of ECMA schemas and compiles 2120 drivers, which is not something
      # to ask three operating systems to do.
      - name: No ECMA bytes in the tree (G-6)
        run: python xtool/xsd-gate/no_ecma_bytes.py
      - name: Optional-element coverage gate (>= 90%)
        run: cargo run -p xtool -- coverage --file coverage/wml-elements.toml --min 89
      - name: Stage-5 extended-scenario coverage gate (>= 85%)
        run: cargo run -p xtool -- coverage --file coverage/stage5-scenarios.toml --min 85

  xsd-gate:
    name: XSD gate (ECMA-376 Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the oracle (never a crate dependency)
        run: pip install -r xtool/xsd-gate/requirements.txt
      # The writer under test is built once here and handed to the gate with
      # `--cli`, so the gate measures a release binary instead of whatever the
      # workspace happened to leave in target/debug.
      - name: Build the writer
        run: cargo build --release -p strict-ooxml-cli
      # G-14: the gate judges the ASSEMBLED package, so the packages are written
      # by the same binary CI just built.
      - name: Write the corpus
        run: |
          mkdir -p /tmp/strict-xsd-gate
          for f in strict-ooxml-core/tests/strict/*.docx; do
            # Exit 1 means "written, with losses in the report" - which is exactly
            # the package the gate needs to look at, so it is not a failure here.
            ./target/release/strict-ooxml write "$f" --out "/tmp/strict-xsd-gate/$(basename "$f")" || true
          done
      - name: No ECMA bytes in the tree (G-6)
        run: python xtool/xsd-gate/no_ecma_bytes.py
      - name: XSD gate
        run: python xtool/xsd-gate/xsd_gate.py --written /tmp/strict-xsd-gate --quiet-messages
      # G-14 of the acceptance: two runs on one corpus must agree. The gate is
      # cheap enough to do twice and it is the only way to catch an oracle that
      # answers differently the second time - which is a gate that cannot be
      # trusted rather than a flaky one.
      - name: The gate is reproducible (second run, same answer)
        run: python xtool/xsd-gate/xsd_gate.py --written /tmp/strict-xsd-gate --quiet-messages

  census-gate:
    # The XSD gate above judges our writer on STRICT input. This one judges the
    # whole `write --transitional` path on Transitional input, which is where the
    # byte-level normalizer, the pass-through and the loss report all meet - and
    # where a defect can be invisible to the other gate by construction: an
    # extension attribute is removed by MCE before conformance is defined, and a
    # dropped part validates perfectly, so neither produces a schema message.
    #
    # It shares the oracle and the schema cache with the job above, not a second
    # definition of "Strict": two oracles would be two definitions and a
    # threshold taken from one and applied to the other would be a number about
    # nothing.
    name: Census gate (Transitional -> Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the oracle (never a crate dependency)
        run: pip install -r xtool/xsd-gate/requirements.txt
      - name: Build the writer
        run: cargo build --release -p strict-ooxml-cli
      # The census gate writes its own corpus and reads the write's own report, so
      # it is given the binary rather than a directory of packages - the same
      # reason the job above builds it, and the reason the gate REBUILDS it
      # locally instead of trusting `target/release`.
      - name: Census gate
        run: python xtool/xsd-gate/census_gate.py --cli ./target/release/strict-ooxml --quiet-messages

  msrv:
    name: msrv (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # The floor in `Cargo.toml` is a promise; this job is what makes it a fact
      # (ADR-0011). `--all-features` on purpose: a floor that only holds for the
      # default build is two floors wearing one name, and the gates above build
      # everything. `--locked` so the answer is about this tree, not about what
      # the resolver would pick today.
      - name: Check (all features, locked)
        run: cargo check --workspace --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      # One codegen unit, for the measurement only (STAGE-5C-REWORK-1 C4). With
      # the default 16 units `parse_document` and the other public entry points
      # are emitted once per unit and `llvm-cov` merges by source line, so a
      # line covered in one copy and absent in another counts as uncovered: the
      # number moved by 11 points on a 200-line change. This is set here rather
      # than in `[profile.dev]` so local debug builds keep the default.
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (core crate, threshold 80%)
        run: cargo llvm-cov -p strict-ooxml-core --all-features --fail-under-lines 80
      - name: Coverage (wml crate, threshold 80%)
        run: cargo llvm-cov -p strict-ooxml-wml --all-features --fail-under-lines 80
      - name: Coverage (report crate, threshold 80%)
        run: cargo llvm-cov -p strict-ooxml-report --all-features --fail-under-lines 80
      - name: Coverage (render-svg crate, threshold 80%)
        run: cargo llvm-cov -p strict-ooxml-render-svg --all-features --fail-under-lines 80
      # The fidelity crate is new and entirely gate arithmetic, so it is measured
      # like any other crate: a threshold with no coverage behind it is a number
      # nobody checked.
      - name: Coverage (fidelity crate, threshold 80%)
        run: cargo llvm-cov -p strict-ooxml-fidelity --all-features --fail-under-lines 80

  fuzz-smoke:
    name: fuzz smoke (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Short fuzz session (zip)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_zip -- -max_total_time=60
      - name: Short fuzz session (xml)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_xml -- -max_total_time=60
      - name: Short fuzz session (relpath)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_relpath -- -max_total_time=60
      - name: Short fuzz session (wml)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_wml -- -max_total_time=60

  fuzz-nightly:
    name: fuzz nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Bounded nightly fuzz sessions
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_zip -- -max_total_time=3600
          cargo +nightly fuzz run fuzz_xml -- -max_total_time=3600
          cargo +nightly fuzz run fuzz_relpath -- -max_total_time=3600
          cargo +nightly fuzz run fuzz_wml -- -max_total_time=3600
