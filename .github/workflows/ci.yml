name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # Pinned, not `stable`: clippy grows new lints with every release and the
      # gate is `-D warnings`, so a floating toolchain turns a release day into a
      # red build for code nobody touched. Moving the pin is a commit of its own.
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The gates above build `--all-features`, so a crate that only compiles with
      # every feature on is invisible to all of them - and `strict-ooxml-convert`
      # sat that way for a whole increment: `Recovered` carried a type that was
      # behind `feature = "raster"`, and the default build did not compile. One
      # check, no features, is what makes the default build a promise again.
      - name: Check (default features)
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-features
      - name: Editing feature matrix
        run: |
          cargo test -p strict-ooxml-edit --locked --no-default-features
          cargo test -p strict-ooxml-edit --locked --no-default-features --features save
          cargo test -p strict-ooxml-edit --locked --no-default-features --features visual
          cargo test -p strict-ooxml --locked --no-default-features --features edit --test editing
      # The debug half of the hostile set ran in the step above. Release is run
      # as well because overflow checks, `debug_assert!` and stack frame sizes
      # all differ there, and a hostile input that is an error in one profile and
      # a silent wrong answer or an overflow in the other is the defect class this
      # set exists for (REWORK-AUDIT-2026-10 AUD-01).
      - name: Hostile inputs (release)
        run: cargo test --workspace --all-features --release --test hostile
      - name: WML independent oracle (P-1)
        run: cargo test -p strict-ooxml-wml --all-features --test corpus_oracle
      - name: Feature Report schema validation (independent oracle)
        run: cargo test -p strict-ooxml-report --all-features --test schema
      - name: Feature Report determinism
        run: cargo test -p strict-ooxml-report --all-features --test determinism
      - name: CLI exit codes and report command
        run: cargo test -p strict-ooxml-cli --test cli
      - name: SVG validity oracle (independent parser)
        run: cargo test -p strict-ooxml-render-svg --all-features --test svg_oracle
      - name: Renderer determinism and images
        run: |
          cargo test -p strict-ooxml-render-svg --all-features --test render
          cargo test -p strict-ooxml-render-svg --all-features --test images
      - name: Renderer corpus (no panics)
        run: cargo test -p strict-ooxml-render-svg --all-features --test corpus
      - name: Render fidelity (SSIM >= 0.95 vs pinned WPS references)
        run: cargo test -p strict-ooxml-render-svg --all-features --test ssim
      # The PDF half of the same gate (SC-6, `CORE-QUEUE.md` §1 `O-2`): the same
      # WPS references, compared against our own PDF rasterized by `hayro` and
      # read back through our own reader. `--features raster` is named because the
      # feature is what turns the comparison on, and a gate that silently skipped
      # itself would be worse than no gate. The first run of it found two defects
      # in the PDF backend that no other test in the workspace could see.
      - name: PDF render fidelity (SSIM >= 0.95 vs pinned WPS references)
        run: cargo test -p strict-ooxml-pdf --features raster --test pdf_pixels
      - name: Real Strict corpus (REWORK-WML-1 + fidelity)
        run: cargo test -p strict-ooxml --all-features --test strict_corpus
      - name: Stage-5 fixture (independent XML oracle + corpus)
        run: |
          cargo test -p strict-ooxml-wml --all-features --test stage5_fixture_oracle
          cargo test -p strict-ooxml-wml --all-features --test stage5_coverage
          cargo test -p strict-ooxml --all-features --test stage5_corpus
      - name: Stage-5B floating DrawingML (oracle + corpus + real Strict)
        run: |
          cargo test -p strict-ooxml-wml --all-features --test drawing_stage5b
          cargo test -p strict-ooxml-wml --all-features --test stage5b_fixture_oracle
          cargo test -p strict-ooxml-render-svg --all-features --test floating
          cargo test -p strict-ooxml-render-svg --all-features --test strict_profile
          cargo test -p strict-ooxml --all-features --test stage5b_corpus
      - name: Stage-5C OMML formulas (oracle + corpus + real Strict repros)
        run: |
          cargo test -p strict-ooxml-wml --all-features --test stage5c_fixture_oracle
          cargo test -p strict-ooxml-wml --all-features --test coverage_gate
          cargo test -p strict-ooxml-render-svg --all-features --test math
          cargo test -p strict-ooxml --all-features --test stage5c_corpus
      - name: Docs
        run: cargo doc --workspace --no-deps
      # G-6 is cheap, needs no dependency and no network, and it belongs next to
      # the other gates so a vendored schema cannot slip in unnoticed. The gate
      # itself runs once, on one OS, in the `xsd-gate` job below: it downloads
      # 43 MB of ECMA schemas and compiles 2120 drivers, which is not something
      # to ask three operating systems to do.
      - name: No ECMA bytes in the tree (G-6)
        run: python xtool/xsd-gate/no_ecma_bytes.py
      - name: Text preservation metric (A04)
        run: python xtool/audit-fixes/text_metric.py
      - name: Audit fixture runner (F00)
        run: python xtool/audit-fixes/run.py --task F00 --phase green --receipt-dir target/audit-fixes/F00/green
      # Synthetic public suite: runs measured F00–F20 tests + metadata.
      # This is not a full audit when matrix.toml still has blocked rows or
      # when --require-corpus was not requested. Receipt claim makes that explicit.
      - name: Public synthetic audit suite (F21)
        run: python xtool/audit-fixes/run.py --task F21 --phase green --receipt-dir target/audit-fixes/F21/green
      # A07: `pdf` must compile and render on its own. The default and
      # all-features builds do not cover `--features pdf` with defaults off.
      - name: Feature matrix (A07)
        run: |
          cargo check -p strict-ooxml --locked --no-default-features
          cargo check -p strict-ooxml --locked --no-default-features --features svg
          cargo check -p strict-ooxml --locked --no-default-features --features pdf
          cargo check -p strict-ooxml --locked --no-default-features --features write
          cargo check -p strict-ooxml --locked --no-default-features --features convert
          cargo check -p strict-ooxml --locked
          cargo check -p strict-ooxml --locked --all-features
          cargo run -p strict-ooxml --locked --no-default-features --features pdf --example render_pdf
          cargo check -p strict-ooxml-cli --locked
      - name: Optional-element coverage gate (>= 90%)
        run: cargo run -p xtool -- coverage --file coverage/wml-elements.toml --min 89
      - name: Stage-5 extended-scenario coverage gate (>= 85%)
        run: cargo run -p xtool -- coverage --file coverage/stage5-scenarios.toml --min 85
      # A parser loop that treats the end of a part as "nothing more" is an
      # infinite loop, not a parse: three such loops shipped in `strict-ooxml-wml`
      # and hung on a truncated `fontTable.xml` (REWORK-AUDIT-2026-10 AUD-04).
      # The reader now refuses to report a truncated part as a complete one, so
      # the lint guards the belt to that pair of braces.
      - name: No parser loop can swallow the end of a part
        run: cargo run -p xtool -- lint-eof

  xsd-gate:
    name: XSD gate (ECMA-376 Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the oracle (never a crate dependency)
        run: pip install -r xtool/xsd-gate/requirements.txt
      # The writer under test is built once here and handed to the gate with
      # `--cli`, so the gate measures a release binary instead of whatever the
      # workspace happened to leave in target/debug.
      - name: Build the writer
        run: cargo build --release -p strict-ooxml-cli
      # G-14: the gate judges the ASSEMBLED package, so the packages are written
      # by the same binary CI just built.
      - name: Write the corpus
        run: |
          mkdir -p /tmp/strict-xsd-gate
          for f in strict-ooxml-core/tests/strict/*.docx; do
            # Exit 1 means "written, with losses in the report" - which is exactly
            # the package the gate needs to look at, so it is not a failure here.
            ./target/release/strict-ooxml write "$f" --out "/tmp/strict-xsd-gate/$(basename "$f")" || true
          done
      - name: No ECMA bytes in the tree (G-6)
        run: python xtool/xsd-gate/no_ecma_bytes.py
      - name: XSD gate failure modes (A05)
        run: python xtool/xsd-gate/test_f01_gates.py
      - name: XSD gate
        run: python xtool/xsd-gate/xsd_gate.py --written /tmp/strict-xsd-gate --quiet-messages
      # G-14 of the acceptance: two runs on one corpus must agree. The gate is
      # cheap enough to do twice and it is the only way to catch an oracle that
      # answers differently the second time - which is a gate that cannot be
      # trusted rather than a flaky one.
      - name: The gate is reproducible (second run, same answer)
        run: python xtool/xsd-gate/xsd_gate.py --written /tmp/strict-xsd-gate --quiet-messages
      # AUD-21: OPC parts against ECMA-376 Part 2. The selftest proves the gate
      # can fail (legacy purl .rels); the gate itself judges the written corpus.
      - name: OPC gate can fail (purl fixture)
        run: python xtool/xsd-gate/opc_gate_selftest.py
      - name: OPC gate (ECMA-376 Part 2)
        run: python xtool/xsd-gate/opc_gate.py --written /tmp/strict-xsd-gate

  # The census gate (`xtool/xsd-gate/census_gate.py`, Transitional -> Strict) is
  # not a job here: half of its corpus, `strict-ooxml-core/tests/docx/`, is local
  # and never published, so a runner cannot have it. It is run by hand; see
  # waiver CENSUS-LOCAL in `docs/waivers.toml`.

  msrv:
    name: msrv (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # The floor in `Cargo.toml` is a promise; this job is what makes it a fact
      # (ADR-0011). `--all-features` on purpose: a floor that only holds for the
      # default build is two floors wearing one name, and the gates above build
      # everything. `--locked` so the answer is about this tree, not about what
      # the resolver would pick today.
      - name: Check (all features, locked)
        run: cargo check --workspace --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      # One codegen unit, for the measurement only (STAGE-5C-REWORK-1 C4). With
      # the default 16 units `parse_document` and the other public entry points
      # are emitted once per unit and `llvm-cov` merges by source line, so a
      # line covered in one copy and absent in another counts as uncovered: the
      # number moved by 11 points on a 200-line change. This is set here rather
      # than in `[profile.dev]` so local debug builds keep the default.
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 1
      # Dedicated target so Windows/local `target/` and dependency phantoms do
      # not leak into the denominator (R10 / REWORK-AUDIT §15).
      CARGO_TARGET_DIR: target/cov-ci
      # Package-only reports: exclude registry / rustc / build phantoms.
      LLVM_COV_IGNORE: (/\\.cargo/registry|/\\.cargo/git|/rustc-|/rustlib/|/build/|/deps/)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Pin the tool: unpinned llvm-cov changed totals between 0.6.x and 0.9.x
      # (R10). Bumping the pin is its own commit.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # REWORK-AUDIT-2026-10 §15.1 line floors. `--ignore-run-fail` keeps the
      # line report when an unrelated assertion fails: the `test` job is still
      # the behavioral gate. Thresholds are not lowered to pass.
      - name: Coverage (core ≥85% + §15 file floors)
        run: |
          cargo llvm-cov -p strict-ooxml-core --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --json --summary-only --output-path target/cov-ci/core.json \
            --fail-under-lines 85
          python xtool/coverage/file_line_gate.py --json target/cov-ci/core.json --min 100 \
            --file xml/escape.rs --file opc/policy.rs --file opc/path.rs
      - name: Coverage (wml ≥85%)
        run: |
          cargo llvm-cov -p strict-ooxml-wml --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 85
      - name: Coverage (report ≥80%)
        run: |
          cargo llvm-cov -p strict-ooxml-report --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 80
      - name: Coverage (render-svg ≥82%)
        run: |
          cargo llvm-cov -p strict-ooxml-render-svg --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 82
      - name: Coverage (fidelity ≥80%)
        run: |
          cargo llvm-cov -p strict-ooxml-fidelity --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 80
      - name: Coverage (write ≥80%)
        run: |
          cargo llvm-cov -p strict-ooxml-write --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 80
      - name: Coverage (pdf ≥75%)
        run: |
          cargo llvm-cov -p strict-ooxml-pdf --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 75
      - name: Coverage (render-pdf ≥75%)
        run: |
          cargo llvm-cov -p strict-ooxml-render-pdf --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 75
      - name: Coverage (convert ≥70%)
        run: |
          cargo llvm-cov -p strict-ooxml-convert --all-features --locked \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 70

  fuzz-smoke:
    name: fuzz smoke (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Short fuzz session (zip)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_zip -- -max_total_time=60
      - name: Short fuzz session (xml)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_xml -- -max_total_time=60
      - name: Short fuzz session (relpath)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_relpath -- -max_total_time=60
      - name: Short fuzz session (wml)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_wml -- -max_total_time=60
      # AUD-92: new targets (normalize / full docx / pdf / convert).
      - name: Short fuzz session (normalize)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_normalize -- -max_total_time=60 -rss_limit_mb=2048 -timeout=10 -dict=dict/wml.dict
      - name: Short fuzz session (docx_full)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_docx_full -- -max_total_time=60 -rss_limit_mb=2048 -timeout=10 -dict=dict/wml.dict
      - name: Short fuzz session (pdf)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_pdf -- -max_total_time=60 -rss_limit_mb=2048 -timeout=10
      - name: Short fuzz session (convert)
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_convert -- -max_total_time=60 -rss_limit_mb=2048 -timeout=10

  fuzz-nightly:
    name: fuzz nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 1
      CARGO_TARGET_DIR: target/cov-ci-branch
      LLVM_COV_IGNORE: (/\\.cargo/registry|/\\.cargo/git|/rustc-|/rustlib/|/build/|/deps/)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,cargo-llvm-cov@0.9.1
      - name: Bounded nightly fuzz sessions (3600s each; not the 60s smoke)
        working-directory: fuzz
        run: |
          for t in fuzz_zip fuzz_xml fuzz_relpath fuzz_wml fuzz_normalize fuzz_docx_full fuzz_pdf fuzz_convert; do
            EXTRA=""
            case "$t" in
              fuzz_normalize|fuzz_docx_full|fuzz_xml|fuzz_wml) EXTRA="-dict=dict/wml.dict" ;;
            esac
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- \
              -max_total_time=3600 -rss_limit_mb=2048 -timeout=10 $EXTRA
          done
      # REWORK-AUDIT-2026-10 §15.1 branch floors (≥70% core/wml). Unstable
      # `--branch` needs nightly; the 60s fuzz-smoke job does not substitute.
      - name: Branch coverage (core ≥70%)
        run: |
          cargo +nightly llvm-cov -p strict-ooxml-core --all-features --locked --branch \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 85 --json --summary-only \
            --output-path target/cov-ci-branch/core-branch.json
          python - <<'PY'
          import json,sys
          t=json.load(open("target/cov-ci-branch/core-branch.json"))["data"][0]["totals"]["branches"]
          c,n=t.get("covered",0),t.get("count",0)
          pct=(100.0*c/n) if n else 0.0
          print(f"core branches {c}/{n} = {pct:.4f}%")
          sys.exit(0 if pct+1e-9>=70.0 else 1)
          PY
      - name: Branch coverage (wml ≥70%)
        run: |
          cargo +nightly llvm-cov -p strict-ooxml-wml --all-features --locked --branch \
            --ignore-filename-regex "$LLVM_COV_IGNORE" --ignore-run-fail \
            --fail-under-lines 85 --json --summary-only \
            --output-path target/cov-ci-branch/wml-branch.json
          python - <<'PY'
          import json,sys
          t=json.load(open("target/cov-ci-branch/wml-branch.json"))["data"][0]["totals"]["branches"]
          c,n=t.get("covered",0),t.get("count",0)
          pct=(100.0*c/n) if n else 0.0
          print(f"wml branches {c}/{n} = {pct:.4f}%")
          sys.exit(0 if pct+1e-9>=70.0 else 1)
          PY
