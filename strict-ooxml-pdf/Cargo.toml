[package]
name = "strict-ooxml-pdf"
description = "PDF reading: pages, text with geometry, fonts, images and vector paths (STAGE-8-TASK.md phase 8C)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["pdf", "extract", "text", "geometry", "ooxml"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
# Object model, xref, filters and the content-stream parser. Everything above
# that — encodings, `ToUnicode`, the graphics state machine, the placement — is
# written here, in the same spirit as the ZIP and XML layers of `core`.
lopdf = "0.45"
# Extra stream filters `lopdf` does not apply for us, and the PNG encoder for
# images that come out of a Flate-compressed XObject.
miniz_oxide.workspace = true
png = "0.18"
# Windows-1252 and MacRoman, which are what `/WinAnsiEncoding` and
# `/MacRomanEncoding` are; hand-written 256-entry tables would be worse.
encoding_rs.workspace = true

[features]
default = []
# Page and region rasterization (`STAGE-8-TASK.md` §6, O3; the input for
# `TextRecovery` in O1 and for the pixel-level half of SC-6). Off by default
# because it is a heavy dependency — 75 crates, a full software rasterizer — and
# most callers of a *reader* want glyph geometry, not pictures.
#
# `hayro` is MIT/Apache-2.0 and needs Rust 1.92, which is why the workspace floor
# is where it is (ADR-0011). Its default features embed the standard fonts and
# the CMaps, which is what makes a page from a producer that references no font
# file render at all instead of coming out blank.
raster = ["dep:hayro"]

[dependencies.hayro]
version = "0.7"
optional = true

[dev-dependencies]
# The geometry oracle needs a document laid out by the real engine and written
# by the real writer, so the reader is tested against the whole chain rather
# than against hand-made fixtures alone. This is not a dependency cycle: the
# writer does not depend on the reader.
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
strict-ooxml-render-svg = { version = "0.1.0", path = "../strict-ooxml-render-svg" }
strict-ooxml-render-pdf = { version = "0.1.0", path = "../strict-ooxml-render-pdf" }
# The pixel gate (SC-6's second half) needs the same SSIM and the same ink checks
# the SVG gate uses: one definition of "fidelity", two renderers.
strict-ooxml-fidelity = { version = "0.1.0", path = "../strict-ooxml-fidelity" }

# The pixel gate and its instrument need a rasterizer, and the `raster` feature is
# what turns one on. They are declared with `required-features` rather than
# switched off inside their source, because a gate that silently skips itself is
# worse than no gate: with this, `cargo test -p strict-ooxml-pdf` says nothing and
# `cargo test -p strict-ooxml-pdf --features raster --test pdf_pixels` says
# everything.
#
# The example is `pdf_page_diff` and not `page_diff`, which is
# `strict-ooxml-render-svg`'s: cargo writes every workspace member's examples to
# one `target/debug/examples/`, so two crates with the same example name link
# into the same `.exe` and one of them fails with LNK1104 at random. That is a
# build that breaks intermittently, which is worse than a failing test.
[[test]]
name = "pdf_pixels"
required-features = ["raster"]

[[example]]
name = "pdf_page_diff"
required-features = ["raster"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

