[package]
name = "mufoed"
description = "MultiFormatEditor (MuFoEd): a desktop demonstrator of the strict-ooxml toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# An application, not a library: never published, so its sibling crates
# are named by path alone (cargo-deny allows that only for a private crate).
publish = false
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ooxml", "docx", "editor", "gui"]
categories = ["gui", "text-editors"]

[[bin]]
name = "mufoed"
path = "src/main.rs"
doc = false

[features]
# Recognition of scanned PDF/DjVu pages through a local Ollama vision model.
default = ["ocr"]
ocr = ["strict-ooxml/ocr-ollama", "strict-ooxml/pdf-raster", "dep:strict-ooxml-pdf", "dep:strict-ooxml-ocr"]

[dependencies]
mufoed-model-runtime = { path = "../model-runtime", features = ["ollama"] }
strict-ooxml-ocr = { path = "../strict-ooxml-ocr", optional = true, features = ["ocr-ollama"] }
diagram-editor = { path = "../diagram-editor", features = ["docx"] }
chem-editor = { path = "../chem-editor", features = ["docx"] }
encoding_rs.workspace = true
strict-ooxml = { version = "0.1.0", path = "../strict-ooxml", features = ["report", "svg", "write", "pdf", "convert", "rtf", "html", "latex", "djvu-image", "edit", "system-fonts", "font-download"] }
strict-ooxml-pdf = { version = "0.1.0", path = "../strict-ooxml-pdf", optional = true, features = ["raster"] }
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-render-svg = { version = "0.1.0", path = "../strict-ooxml-render-svg" }
eframe = "0.35"
rfd = "0.17"
resvg.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
unicode-segmentation = "1.12"
ureq = "3"
pulldown-latex = "0.8"
url = "2.5"
# The clipboard's HTML and pictures on every platform (egui already links it).
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
png.workspace = true

[target.'cfg(windows)'.dependencies]
# The watchdog's stack capture of a frozen interface thread (`stack.rs`).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_DataExchange", "Win32_System_Memory"] }

[lints]
workspace = true
