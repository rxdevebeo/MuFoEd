[package]
name = "mufoed-model-runtime"
description = "Shared admission and lifecycle coordination for MuFoEd model backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
ollama = ["dep:ureq", "dep:serde_json", "dep:url"]

[dependencies]
sysinfo = { version = "0.34.2", default-features = false, features = ["system"] }
sha2 = "0.10"
ureq = { version = "3", optional = true }
serde_json = { workspace = true, optional = true }
url = { version = "2.5", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
