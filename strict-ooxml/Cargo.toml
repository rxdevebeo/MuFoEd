[package]
name = "strict-ooxml"
description = "Public API for reading WordprocessingML Strict documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = false
keywords = ["ooxml", "docx", "wordprocessingml", "strict"]
categories = ["parser-implementations"]

[features]
default = ["report", "svg", "write", "pdf", "convert"]
# Stage 4: enables `strict-ooxml-render-svg` and the render methods on
# `StrictDocument` (TZ §5.4).
svg = ["dep:strict-ooxml-render-svg"]
# Stage 3: enables `strict-ooxml-report` and the report methods on
# `StrictDocument` (TZ §5.4).
report = ["dep:strict-ooxml-report"]
# Stage 8A: enables strict-ooxml-write and the write methods on
# StrictDocument (STAGE-8-TASK.md 3).
write = ["dep:strict-ooxml-write"]
# Stage 8B: enables strict-ooxml-render-pdf and the PDF methods on
# StrictDocument (STAGE-8-TASK.md 4).
pdf = ["dep:strict-ooxml-render-pdf"]
# Stage 8C+: PDF reading and the conversion of a PDF into a Strict document.
convert = ["dep:strict-ooxml-pdf", "dep:strict-ooxml-convert"]
# Parallel parsing of independent parts.
parallel = ["strict-ooxml-wml/parallel"]

[dependencies]
strict-ooxml-core = { version = "0.1.0", path = "../strict-ooxml-core" }
strict-ooxml-wml = { version = "0.1.0", path = "../strict-ooxml-wml" }
strict-ooxml-report = { version = "0.1.0", path = "../strict-ooxml-report", optional = true }
strict-ooxml-render-svg = { version = "0.1.0", path = "../strict-ooxml-render-svg", optional = true }
strict-ooxml-write = { version = "0.1.0", path = "../strict-ooxml-write", optional = true }
strict-ooxml-render-pdf = { version = "0.1.0", path = "../strict-ooxml-render-pdf", optional = true }
strict-ooxml-pdf = { version = "0.1.0", path = "../strict-ooxml-pdf", optional = true }
strict-ooxml-convert = { version = "0.1.0", path = "../strict-ooxml-convert", optional = true }

[[example]]
name = "support_report"
required-features = ["report"]

[[example]]
name = "render_svg"
required-features = ["svg"]

[lints]
workspace = true
