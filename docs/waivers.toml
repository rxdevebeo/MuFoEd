[[waivers]]
id = "W7-DROPPED"
subject = "10 pass-through — parts the write drops and says so"
binds = "process:write-dropped-parts"
summary = """
A part that is absent from the written package is the one loss in this project
that **nothing else can see**. It draws nothing, it validates against every
schema, and until 2026-10-01 it left no trace in a loss report that never
mentioned it — which is what `docs/transitional-to-strict-audit.md` §8 called "a
silent loss", naming 16 embedded font binaries in 2 documents, gone together with
`word/_rels/fontTable.xml.rels`.

Two things landed. `passthrough::report_what_was_dropped` walks the source
package and names every part this write did not emit, grouped by directory, as
`W7.dropped-part`; and `xtool/xsd-gate/census_gate.py` grew an `unaccounted`
signal that fails on a dropped part the report does **not** mention, so "the
report says nothing about it" is a measured zero rather than an opinion.

What this waiver covers is the *remaining* drops, which are named but not fixed:

- ~~`word/fonts/*.ttf` and `word/_rels/fontTable.xml.rels`~~ — **closed
  2026-10-02.** Embedded fonts are legal Strict and are now carried: a
  `word/fontTable.xml` reader, a `FontTable` model type, `w:embed*` emission with
  its `w:fontKey` and `w:subsetted`, the font table's **own** relationship part
  (`w:embedRegular/@r:id` names a relationship of *that* part, and the source's
  ids mean nothing in a package we write), the bytes, and the content type —
  `application/x-font-ttf` for a plain font and `…obfuscatedFont` for an
  `odttf`, because ECMA-376 §17.8.1 XOR-obfuscates the first 32 bytes of an
  obfuscated font under the key and a consumer needs both halves. Ten faces in
  `DOCX_13_Pages` round-trip byte for byte
  (`strict-ooxml-write/tests/fonts.rs`).
- `word/stylesWithEffects.xml` (19 documents). **Deliberate, and the strongest
  case in the file:** Word 2010's shadow of `styles.xml`. Keeping it would leave
  the package with two sets of styles while the written `styles.xml` is the
  model's, and Word 2010 prefers the shadow — so the copy would be *stale*. Two
  copies of one authority is worse than one. Named as `W7.stylesWithEffects`.
- ~~`docProps/thumbnail.jpeg` / `.wmf`~~ — **closed 2026-10-02.** The pass-through
  copied a property part's `.rels` and then stopped, so `docProps/app.xml` arrived
  declaring a thumbnail that was not in the package. A property part's
  relationship **targets** are carried with it now; the ledger showed nine
  thumbnails lost for exactly this and it was right.
- ~~`word/media/image#.jpg` / `.wmf`~~ — **not a loss, and the ledger was wrong.**
  It reported ten documents, and every one was a false positive: this writer
  **renames** the media it carries (`media/image3.png` becomes
  `media/image1.png`), so a name comparison calls every renamed-but-carried
  picture missing. `census_gate.py`'s part ledger now compares SHA-256 of the
  bytes, which is the question rather than a proxy for it — 181 "drops" became 33,
  then 21 once the package thumbnails were carried. The nine `.wmf` that remain
  are the `L-3` format boundary and are carried by the pass-through when
  something references them.
- `word/numbering.xml` (1 document). A numbering part the model read as empty, so
  the write emitted none. This is the one item here that is a *model* gap rather
  than a decision, and it is the cheapest to look at.

Numbers are the census's, on 58 Transitional documents written with
`--transitional`; the item is `TZ-15` there and the gate fails while it is
non-zero *and unaccounted*, which is zero.
"""
risk = """
A named drop is a decision a reader can check; the risk left is that the *decision*
is wrong, not that it is hidden. Two of them are arguable rather than settled —
embedded fonts and the unreferenced `.jpg` media — and the numbering one is
plainly a gap.
"""
exit = """
Carry the embedded fonts properly (a font-table reader, a model type for
`w:embed*`, the relationships and the content types), and look at the one document
whose numbering table parses empty. `stylesWithEffects.xml` and unreferenced media
are decisions to keep, and the waiver is the record of that — with a review date.
"""
opened = "2026-10-02"
review = "2027-01-02"

[[waivers]]
id = "PDF-OBJSTM-BOMB"
subject = "PDF reader — object-stream inflation inside lopdf::Document::load"
binds = "process:pdf-objstm-bomb"
summary = """
Stream decompression for page content, forms, images and ToUnicode is bounded
by `bounded_decompress` / `get_page_content_with_limit` (AUD-13). Object streams
inflated while `lopdf::Document::load_mem` builds the object graph are not: that
path is inside the dependency. The outer fence is `PdfLimits::max_input_bytes`
(256 MiB, checked before load). The residual risk is accepted; the long-run
guard is the fuzz target `fuzz_pdf` (AUD-92). AUD-88 closed stack/loop holes in
the *rasterizer* via vendored hayro; a plain `/Kids` cycle is covered by
`hostile::raster::page_tree_kids_cycle_is_handled`. Object-stream expansion
during lopdf load remains this waiver's subject.
"""
risk = """
A crafted PDF whose object streams expand far beyond the compressed input could
allocate heavily during load, up to what the process can give, before any page
is read. The input-size ceiling bounds how large the compressed file may be; it
does not bound the expansion ratio of object streams.
"""
exit = """
`fuzz_pdf` landed (AUD-92) and runs in CI `fuzz-smoke` / `fuzz-nightly`. Keep
a seed corpus of object-stream bombs under it; or switch the loader to a path
that applies `LoadOptions::max_decompressed_size` (or an equivalent) and close
this waiver.
"""
opened = "2026-10-03"
review = "2027-01-03"
