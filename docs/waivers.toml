"""
exit = """
Raising the score above the margin, or understanding why the PDF path loses
0.007 where the SVG path does not. The `page_diff` example for the PDF path
prints the ink bands and the difference bands, which is where the answer is.
"""
opened = "2026-10-01"

[[waivers]]
id = "PDF-AMBER-5C"
subject = "strict-stage5c (PDF gate)"
binds = "pdf-amber:strict-stage5c"
summary = "Worst SSIM 0.9511 on the PDF path, clearing 0.95 by 0.0011."
risk = """
The thinnest margin in the registry. Two display formulas in STIX Two Math against
