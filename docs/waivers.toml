Keep the name out of the product identity and put an affiliation disclaimer in
`README.md` and `strict-ooxml-djvu/README.md`: "reads DjVu files" and the format
name only, never as a brand for this project, no logo, no certification mark. If
the project ever needs a clearance opinion for commercial distribution, this is
the entry that points at it.
"""
