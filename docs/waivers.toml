[[waivers]]
id = "FUZZ"
subject = "fuzzing"
binds = "process:fuzz-hosting"
summary = "No dedicated 24 h fuzz host; CI runs four bounded 1 h sessions nightly."
risk = """
Hidden panics in the ZIP/XML/relative-path/Word parsers beyond what 1 h per
target finds. The fuzz targets and protocol are in place and run on every
nightly build, so this is a depth gap, not an absence of coverage.
"""
exit = """
Either provision a Linux host for long runs, or accept the nightly sessions
explicitly with the depth written down.
"""
opened = "2026-09-29"

[[waivers]]
id = "VERTJC"
subject = "5C formulas"
binds = "process:m-vert-jc"
summary = "`m:vertJc` on a group character is parsed and reported but does not affect alignment."
