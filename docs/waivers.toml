# ---------------------------------------------------------------------------
# Process gaps. No code binding, so the test only checks that a `process:`
# target is spelled like one. These are reviewed by hand at acceptance.
# ---------------------------------------------------------------------------

[[waivers]]
id = "A-1"
subject = "real Strict corpus"
binds = "process:real-strict-ssim"
summary = """
The documents under pixel comparison are synthetic (`xtool gen-docx`) or
hand-built by the same author who wrote the renderer (`05`-`10`).
"""
risk = """
The product claim "displays a document" is not demonstrated on a document
somebody else produced. The references are WPS-produced and independent, but
the input documents are not.
"""
exit = """
Get `04-libreoffice-roundtrip-strict` and `msword-strict-some-text` into
`strict-ooxml-core/tests/strict/` with attribution and a compatible licence
(STAGE-5C-REWORK-1 D5), pin WPS references for them, and gate them. This is
blocked on licensing, not on the renderer.
"""
opened = "2026-09-29"

[[waivers]]
