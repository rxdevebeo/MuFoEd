[[waivers]]
id = "DJVU-PATENT"
subject = "9A DjVu reading"
binds = "process:djvu-patents"
summary = """
Importing DjVu means implementing a format whose reference library has shipped
under GPL-2.0 since 1999, with a LizardTech grant over "the LIZARDTECH ORIGINAL
CODE or of programs derived from" it. This project links neither: it depends on
the MIT-licensed `djvu-iff`/`djvu-zp`/`djvu-bzz` crates and writes the container,
the zone tree and the mapping itself from the published specification
(DjVu Reference v3, November 2005, status "Released"). No freedom-to-operate
search was commissioned.
"""
risk = """
Three unknowns, accepted by the owner on 2026-10-01 rather than researched
(`STAGE-9-TASK.md` §2.2.6):

1. The header of every `libdjvu/*.cpp` says "protected by U.S. Pat. No. 6,058,214
   and patents pending" — as of the 2007 amendment. The pending set was never
   enumerated. An assignment search over LizardTech, Celartem, Celartem
   Technology, Celartern, Dalen, Access Software and GeoWGS84 found no DjVu
   codec patent, but the search was incomplete.
2. US 5,900,953 (foreground/background separation — the conceptual core of the
   format) reads NOT_ACTIVE in the US and ACTIVE in Canada; the Canadian record
   was not retrieved.
3. EP 1,050,014 and the EP/KR/CA family members of the US 9,830,535 continuation
   chain read ACTIVE; none was retrieved.

What is *not* open: US 6,058,214 expired 2019-01-19 (35 U.S.C. 154(a)(2), twenty
years from the 1999-01-19 filing), and its sole independent claim is an *encoding*
method — the decoder "can be decoded according to normal wavelet techniques
regardless of the mask" — so a read-only implementation does not practise it at
any term. Writing DjVu is therefore out of scope by design, not by taste. The
underlying method is published science (Bottou et al., JEI 7(3):410-425, 1998).
"""
exit = """
Either commission an FTO search over the assignees named above and close the
three unknowns, or accept the residual risk in writing at the point where this
project first plans *commercial* distribution — at which point a written opinion
from a patent attorney becomes mandatory rather than optional. Until then the
provenance table in ADR-0012 (module -> source) is what makes this project's
clean-room position checkable, and it is maintained from that ADR.
"""
opened = "2026-10-01"

