# ---------------------------------------------------------------------------
# The PDF backend's half of the same gate (`CORE-QUEUE.md` §1, `O-2`).
#
# The PDF was measured for the first time on 2026-10-01: same WPS references,
# same fidelity criterion (0.95 + 0.01 margin), a different renderer (`hayro`,
# reading back the file this workspace wrote). Every entry below is a measured
# number written down with the reason it is that number.
# ---------------------------------------------------------------------------

[[waivers]]
id = "PDF-LIMITS-TEXT"
subject = "PDF backend, text class"
binds = "pdf-class:text"
summary = """
The PDF gate holds the text class to `max_centroid_px = 3.0` against the strict
default of 2.5. Measured 2.50 px on `strict-text`; `strict-text-grid` is 0.82.
The same 3.0 is carried by `max_content_centroid_px`, measured 2.50 as well —
this class has no page border, so the two measures see the same ink.
"""
risk = """
This is Q-5 measured, not rasterizer noise. The PDF writer rounds every glyph's
`/W` advance to whole 1000-units, so each glyph is up to half a thousandth of an
em out and the error accumulates along the line; the last word of every line ends
a couple of pixels from where `resvg` puts it. `/W` is an integer array in the
specification, so this is not something the writer can simply stop doing.
"""
exit = """
Write the advances as `f32` in a `/W`-style array that allows fractional values,
or compensate the last glyph of a line by its own residual. Then the SVG gate's
2.5 holds for the PDF gate too.
"""
opened = "2026-10-01"

[[waivers]]
id = "PDF-LIMITS-MIXED"
subject = "PDF backend, mixed class"
binds = "pdf-class:mixed"
summary = """
`max_centroid_px = 4.0` against the SVG gate's 3.0 and the strict default of 2.5.
Measured 3.72 px on `strict-stage5` page 2. `max_content_centroid_px` is 4.0 as
well, measured 3.72: this class has no page border, so the frame-free measure is
the same measurement.
"""
risk = """
The same accumulation as PDF-LIMITS-TEXT on a page whose ink is spread over
tables, notes and fields, so the mean has less to average over and the same
absolute drift shows up larger. Every other bound on that page is inside the SVG
gate's mixed bounds: shift 2 px, extent +1/-0, row correlation 0.980, column
correlation 0.814.
"""
exit = "As PDF-LIMITS-TEXT."
opened = "2026-10-01"

[[waivers]]
id = "PDF-LIMITS-GRAPHICS"
subject = "PDF backend, graphics class"
binds = "pdf-class:graphics"
summary = """
`max_centroid_px = 40.0` (measured 38.76) **and** `max_content_centroid_px = 8.0`
(measured 0.11). The second number is the one that holds the page; the first is
the plain ink centroid, which on this page measures the page border rather than
the layout.
"""
risk = """
`strict-stage5b` is mostly a page border: a 2.67 px stroke down all four edges.
Its ink is symmetric, so the centroid of the *page* sits near the middle, and a
one-pixel difference in one edge of that stroke — which is the whole of what
`resvg` and `hayro` disagree about on a long thin line — moves the mean by tens of
pixels. Measured: the two backends' plain centroids differ by 25 x 39 px on this
page, while their content centroids differ by 3.95 x 0.11.
"""
exit = """
The 8 px is what now does the work, so this entry is no longer "a bad measure
accepted": `strict-ooxml-fidelity::structure::content_centroid` is the
frame-free measure and it is a real bound. What remains is the *plain* 40 px,
which no measure of the layout needs — it can go when the plain centroid is
either dropped from the structural check or given a stated rule of its own (a
bound per class, documented, instead of one number wide enough to absorb a
rasterizer's antialiasing).
"""
opened = "2026-10-01"

[[waivers]]
id = "PDF-AMBER-5B"
subject = "strict-stage5b (PDF gate)"
binds = "pdf-amber:strict-stage5b"
summary = "Worst SSIM 0.9595 on the PDF path, clearing 0.95 by 0.0095."
risk = """
Inside the 0.01 margin band, so the score cannot distinguish a property of the
layout from a property of one rasterizer build. The same page measures 0.9664
