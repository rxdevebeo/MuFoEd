# Registry of conditional acceptances and waivers (GATE-STRATEGY §2).
#
# Every entry here is a place where the work is accepted below what the
# criteria ask for. The file is the whole of §2: it is checked by
# `strict-ooxml-render-svg/tests/waivers.rs`, so an entry that stops being true
# fails the build rather than quietly misleading the next reader.
#
# `binds` is what authorises the entry, and is what the test resolves. The
# vocabulary is closed:
#
#   class:<name>            the class in coverage/render-gates.toml whose
#                           bounds are looser than the strict defaults
#   amber:<document>        a document inside the SSIM margin band
#   page-count-only:<doc>   a document compared by page count only
#   process:<topic>         a process gap with no code binding; reviewed by
#                           hand at acceptance, not machine-checked
#
# An entry whose `binds` target no longer exists fails, so the registry cannot
# rot into a list of resolved problems still described as open.

[meta]
revision = "2026-10-01"
policy = "GATE-STRATEGY.md §2"
source = "GATE-STRATEGY.md, STAGE-5C-REWORK-1.md, STAGE-5C-ACCEPTANCE.md, STAGE-9-TASK.md"

# ---------------------------------------------------------------------------
# Bound by the gate itself. Removing one of these is a change in what the
# product claims, not a cleanup.
# ---------------------------------------------------------------------------

[[waivers]]
id = "A-1-LIMITS"
subject = "5A mixed"
binds = "class:mixed"
summary = """
The mixed class carries centroid 3 px and correlation floors 0.75/0.70,
against strict defaults of 2.5/0.90/0.85. This is `STAGE-5-LIMITS` from
Stage 5, and it is not in the GATE-STRATEGY §2 table — the gate found it.
"""
risk = """
Only the correlations are loosened, and only because a sparse mixed page
carries little structure for a profile correlation to lock onto. The
rasterizer-independent checks (ink coverage, blank page, 2 px shift, 2 px
extent) are at the strict defaults and measured at 0-1 px, so this class is
not carrying a known layout defect.
"""
exit = """
Show the correlations are meaningful on sparse pages, or replace them with a
measure that is defined there — the extent check is now doing most of this
work and may make the correlation floors unnecessary.
"""
opened = "2026-09-29"

[[waivers]]
id = "A-5B-3"
subject = "5B graphics"
binds = "class:graphics"
summary = """
The graphics class carries centroid 8 px and correlation floors 0.60/0.50,
against strict defaults of 2.5/0.90/0.85.
"""
risk = """
A page whose ink is distributed wrongly but whose profiles still correlate
weakly enough can pass. The rasterizer-independent checks (ink coverage, blank
page, 2 px shift, 2 px extent) are unchanged and measured at 1 px, so the
class is not carrying a known layout defect.
"""
exit = """
Root-cause the centroid offset (fill/edge antialiasing of large solid shapes)
and return the class to the defaults, or replace the centroid with a measure
that is not sensitive to how much ink each glyph carries.
"""
opened = "2026-09-29"

[[waivers]]
id = "5C-C4"
subject = "5C formulas"
binds = "class:formulas"
summary = """
The formulas class is outside its own bounds on four pages. With
max_centroid_px returned to the strict default of 2.5, the gate fails and
names all four at once:

  06-strict-math-display  page 0  centroid (-10.67,  -2.57)
  07-strict-drawingml-…   page 0  centroid (  0.79,  -2.57)
  strict-stage5c          page 0  centroid (  1.84,   8.91)
  strict-stage5c          page 1  centroid ( 24.76,  13.47)

The bound was 24 before, and that 24 was not a limit at all: it was the
value that happened to contain `strict-stage5c` page 1 and the two others
behind it. It never rejected anything. max_extent_px = 18 is the same
shape of thing and still is — it equals that page's measured bottom drift
of 18.00 px.
"""
risk = """
The gate reports the class as failing. That is the honest state: three of
five formula fixtures have ink centroids 2.5-25 px from the reference, and
05-strict-math-simple is the only one inside. Nobody has been able to say
which is the real defect, because a bound fitted to the first failure
names nothing.
"""
exit = """
Correct the display-block box so every page in the class meets 2 px, then
return the class to the strict defaults on every axis including the extent
bound. `EXTENT_RATCHET` in `tests/ssim.rs` pins every page's current drift
and fails if a page moves further, so the numbers have to move rather than
the bound.
"""
opened = "2026-09-30"

[[waivers]]
id = "5C-C3"
subject = "5C formulas"
binds = "process:math-font"
summary = """
STIX Two Math is bundled for Cambria Math and is not metric-compatible with
it; no OFL face is. Block geometry follows the nominal font's line metrics,
but glyph outlines, weights and advances still differ.
"""
risk = """
The residual is a ceiling on glyph-level SSIM that no threshold change
absorbs. This is why chasing a metric-compatible face was abandoned rather
than retried.
"""
exit = """
Already decided (ADR-0006): keep the threshold, follow the nominal metrics for
block geometry, and record the glyph residual. Revisit only if a Cambria
Math-compatible face appears under a redistributable licence.
"""
opened = "2026-09-29"

[[waivers]]
id = "5C-AMBER"
subject = "strict-stage5c"
binds = "amber:strict-stage5c"
summary = "Worst SSIM 0.9533, clearing the 0.95 criterion by 0.0033."
risk = """
The gate runs on three operating systems. At three thousandths the score
cannot distinguish a property of the layout from a property of one rasterizer
build, so this page can go red on a runtime nobody tested locally.
"""
exit = """
The same block-geometry fix as 5C-C4. Clearing the 0.01 margin removes the
entry — the gate then checks that the observed amber set matches the register
in both directions, so the entry cannot be left behind after the fix.
"""
opened = "2026-09-29"

[[waivers]]
id = "07-AMBER"
subject = "07-strict-drawingml-shapes"
binds = "amber:07-strict-drawingml-shapes"
summary = "Worst SSIM 0.9568, clearing the 0.95 criterion by 0.0068."
risk = """
Same runtime sensitivity as 5C-AMBER. The underlying drift is the opposite
sign to the rest of the class - the page is 16 px *shorter* than the
reference - which is what identifies the block box, not one oversized
operator, as the cause.
"""
exit = """
Closed 2026-10-01 without the block-geometry rework the entry expected, because
the cause was one line and it was not the block box. A line that grows for an
inline drawing grew its *ascent* and set `height = max(natural, ascent)`, which
discards the line's depth: a line box has a depth even when its tallest item has
none, because the paragraph mark is still a glyph with a descent. So the 8 pt
`w:after` of this document's `docDefaults` landed directly against the bottom of
each shape instead of below the line's descent.

Growing the ascent and keeping the depth moves the page's bottom ink edge from
-16 px to +1 px, which is inside the 2 px default, and its worst SSIM from
0.9709 to 0.9805 - clear of the 0.01 margin, so it leaves the amber list.
"""
opened = "2026-09-29"
closed = "2026-10-01"
closed_by = """
`finish_line` in `strict-ooxml-render-svg/src/layout/paragraph.rs`:
`height = max(natural, ascent + depth)` instead of `max(natural, ascent)`.
`EXTENT_RATCHET` pins the page at +1 px, and the gate no longer lists it as
amber (2026-10-01). Measured with
`cargo run -p strict-ooxml-render-svg --example page_diff -- 07-strict-drawingml-shapes 0`.
"""

