The gate now measures something real and reports **89.7%**, which is below its
90% target, so CI runs it at 89 and this entry carries the difference. Seventeen
elements were reclassified from `ignored` to `unsupported` because they change the
page and nothing renders them: `w:comments`, `w:object`, `w:pict`, `w:fitText`,
`w:paperSrc`, `w:pgNumType`, `w:tblOverlap`, `w:tblCellSpacing`, `w:tblpPr`,
