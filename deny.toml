# cargo-deny configuration (TZ §3, §18.1; stage task S1.1/S1.18).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "warn"
# Permissive, non-copyleft, and each one here for a stated reason (TZ §16.8 asks
# for MIT/Apache-2.0; the list has grown by decision, not by accident):
#
# - BSD-3-Clause, Unicode-3.0: added with the graphics and font stack.
# - Zlib, ISC: `foldhash` and `hashbrown` arrive with the PDF rasterizer
#   (hayro, feature `raster`, ADR-0011; AUD-88 vendors hayro/hayro-interpret/
#   hayro-syntax under `vendor/` via `[patch.crates-io]` — same licences), and
#   `ring`/`untrusted`/`rustls-webpki` with the TLS stack of the OCR client
#   (`ureq`, feature `ocr-ollama`). Both are permissive and OSI-approved.
# - CDLA-Permissive-2.0: `webpki-roots`, a root store for the same TLS stack.
#   It is a data licence, not a code one; the code it ships is ISC/MIT.
# MPL-2.0 is deliberately NOT here. The LibreOffice fixtures under
# `strict-ooxml-core/tests/strict/` (MPL-2.0 test data, `docs/corpus-task-strict-docx.md`
# §4.1) are files, not Cargo dependencies, so no licence scanner sees them and the
# allow-list has nothing to say about them. Listing MPL here would let an MPL crate
# into the dependency graph silently, which is the opposite of the intent.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `strict-ooxml-testkit` is `publish = false` and only ever a dev-dependency, so
# it is named by path alone: a version would make `cargo publish` look for it on
# crates.io. cargo-deny allows exactly that case - a path dependency that is a
# dev-dependency or belongs to a private crate - and still denies every other
# wildcard.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
